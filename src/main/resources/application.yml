server:
  port: 8080

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 客户自助下单平台对接：付印报文发送地址（POST application/xml）。
# 演示前配置对方接收地址，如 http://<平台地址>/api/exchange/inbound；
# 留空时发送直接失败并归档，配置后可重试。
exchange:
  gateway-url: ${EXCHANGE_GATEWAY_URL:}

logging:
  level:
    com.evops: INFO
